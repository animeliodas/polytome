[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polytome"
version = "0.4.0"
description = "Переводчик книг на основе LLM с проверками кодом (имена по Палладию, пол, числа); CLI, API для приложений, MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["translation", "llm", "epub", "fb2", "chinese", "russian", "web-novel", "palladius"]
dependencies = [
  "httpx>=0.27",
  "rich>=13",
  "prompt_toolkit>=3",
  "pypinyin>=0.50",
  "pymorphy3>=2",
  "pymorphy3-dicts-ru",
]

[project.scripts]
polytome = "polytome.cli:main"

[project.urls]
Source = "https://github.com/animeliodas/polytome"

[tool.setuptools]
packages = ["polytome"]
include-package-data = true

[tool.setuptools.package-data]
polytome = ["styles/*.md", "locales/*.json", "integrations/**/*"]
